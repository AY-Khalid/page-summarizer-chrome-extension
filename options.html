<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Api Keys options</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        padding: 20px;
        background-color: rgba(7, 58, 55, 0.08);
        outline: none;
        border: none;
        box-sizing: border-box;
    }
    h1 {
        margin-bottom: 20px;
    }
    form {
        max-width: 400px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }
    input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        outline: none;
    }
    .success-message {
        color: green;
        font-weight: bold;
        /* display: none; */
    }
    button {
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background-color: #45a049;
    }

</style>
<body>
    <h1>Api Keys Options</h1>
    <div class="form-group">
        <label for="api-key">Gemini API Key</label>
        <input type="password" id="api-key" placeholder="Enter your Gemini API key">
        <p>You can get your API key from the <a href="https://makersuite.google.com/app/apikey" target="_blank">Gemini AI Studio</a>.</p>
    </div>
    <button id="save-button">Save API Key</button>
    <p id="success-message" class="success-message"></p>

    <script src="options.js"></script>
</body>
</html>
