<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Summarizer</title>
</head>

<style>
        :root {
        --bg-main: #f4f9f8;
        --bg-header: #dcf3f2;
        --text-primary: #333;
        --output-bg: #ffffff;
        --border-color: #ccc;
        }

        body.dark-mode {
            --bg-main: #121212;
            --bg-header: #1f2928;
            --text-primary: #e0e0e0;
            --output-bg: #1e1e1e;
            --border-color: #444;
        }

    html, body{
        height: 100%;
    }
    body {
        background-color: var(--bg-main);
        color: var(--text-primary);
        transition: all 0.2s ease;
        margin: 0;
        padding: 0;
        min-width: 420px;
        /* min-height: 500px; */
        /* height: 400px; */
        /* background-color: rgba(7, 58, 55, 0.08); */
        /* outline: none; */
        /* border: none; */
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif, Tahoma, Geneva, Verdana;
    }
    h2{
        padding: 4px 20px;
    }
    pre, button,select{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
    }

    .popup-container {
        display: flex;
        flex-direction: column;
        min-height: 500px;
    }

    .popup-header {
        display: flex;
        /* justify-content: space-between; */
        align-items: center;
        padding: 20px;
        /* background-color: #dcf3f2; */
        background-color: var(--bg-header);
        flex-wrap: wrap;
        gap: 20px;
    }

    .popup-header select,
    .popup-header button {
        padding: 10px 12px;
        margin-left: 5px;
    }
    button {
        cursor: pointer;
        border-radius: 6px;
        border: none;
        text-align: center;
    }
    #summarize-btn {
        background-color: #4CAF50;
        color: white;
    }
    #clear-btn {
        background-color: #f44336;
        color: white;
    }
    #copy-btn {
        background-color: #2196F3;
        color: white;
    }
    .popup-content {
        flex: 1;
        padding: 20px;
        display: flex;
    }

#summary-output {
    flex: 1;
    width: 100%;
    padding: 15px;
    /* border: 1px solid #ccc; */
    border-radius: 8px;
    /* background: white; */
    overflow-y: auto;
    white-space: pre-wrap; 
    word-wrap: break-word;
    font-family: 'Segoe UI', sans-serif; 
    line-height: 1.5;
    /* color: #333; */
    background-color: var(--output-bg);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
}

.icon-btn {
    background: rgb(79, 79, 79, 0.3);
    color: var(--text-primary);
}

select{
    background-color: var(--bg-main);
    color: var(--text-primary);
}

    .loading {
        height: 100%;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
<body>
<div class="popup-container">
    <h2 id="page-title">Article Summarizer</h2>
    <p id="reading-time" style="padding: 0 20px; margin: -10px 0 10px 0; font-size: 0.9em; color: #666;">

    </p>

    <div class="popup-header">
            <select name="selection-type" id="selection-type">
                <option value="brief" selected>Brief</option>
                <option value="detailed">Detailed</option>
                <option value="bullet">Bullet Points</option>
            </select>
            <button id="summarize-btn">Summarize</button>
            <button id="clear-btn">Clear</button>
            <button id="copy-btn">Copy</button>

        <button id="theme-toggle" class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 512 512">
                <path
                    d="M223.5 32C100 32 0 132 0 255.5S100 479 223.5 479c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z" />
            </svg>
        </button>
        </div>
        <div class="popup-content">
            <pre id="summary-output" >Select a summary type and click 'Summarize'</pre>
        </div>
    </div>

<script src="popup.js"></script>
</body> 
</html>
