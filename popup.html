<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Summarizer</title>
</head>

<style>
    html, body{
        height: 100%;
    }
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-width: 420px;
        /* min-height: 500px; */
        /* height: 400px; */
        background-color: rgba(7, 58, 55, 0.08);
        outline: none;
        border: none;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    h2{
        padding: 4px 20px;
    }
    pre, button,select{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
    }

    .popup-container {
        display: flex;
        flex-direction: column;
        min-height: 500px;
    }

    .popup-header {
        display: flex;
        /* justify-content: space-between; */
        align-items: center;
        padding: 20px;
        background-color: #dcf3f2;
        flex-wrap: wrap;
        gap: 20px;
    }

    .popup-header select,
    .popup-header button {
        padding: 10px 12px;
        margin-left: 5px;
    }
    button {
        cursor: pointer;
        border-radius: 6px;
        border: none;
        text-align: center;
    }
    #summarize-btn {
        background-color: #4CAF50;
        color: white;
    }
    #clear-btn {
        background-color: #f44336;
        color: white;
    }
    #copy-btn {
        background-color: #2196F3;
        color: white;
    }
    .popup-content {
        flex: 1;
        padding: 20px;
        display: flex;
    }

#summary-output {
    flex: 1;
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
    overflow-y: auto;
    white-space: pre-wrap; 
    word-wrap: break-word;
    font-family: 'Segoe UI', sans-serif; 
    line-height: 1.5;
    color: #333;
}

    .loading {
        height: 100%;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
<body>
<div class="popup-container">
    <h2 id="page-title">Article Summarizer</h2>
    <p id="reading-time" style="padding: 0 20px; margin: -10px 0 10px 0; font-size: 0.9em; color: #666;">
        
    </p>

    <div class="popup-header">
            <select name="selection-type" id="selection-type">
                <option value="brief" selected>Brief</option>
                <option value="detailed">Detailed</option>
                <option value="bullet">Bullet Points</option>
            </select>
            <button id="summarize-btn">Summarize</button>
            <button id="clear-btn">Clear</button>
            <button id="copy-btn">Copy</button>
        </div>
        <div class="popup-content">
            <pre id="summary-output" >Select a summary type and click 'Summarize'</pre>
        </div>
    </div>

<script src="popup.js"></script>
</body> 
</html>
